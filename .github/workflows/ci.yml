name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and test
        run: ./gradlew build
      - name: Verify packaged service and native model runtime
        run: python3 scripts/packaged-smoke.py

  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - test-mysql.sh
          - test-analysis-mysql.sh
          - test-operations-mysql.sh
          - test-recovery-mysql.sh
          - test-ml-mysql.sh
          - test-communications-mysql.sh
          - test-scheduler-mysql.sh
          - test-reporting-mysql.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate original MySQL schema
        if: matrix.script == 'test-mysql.sh'
        run: python3 tools/verify_mysql_schema.py
      - name: Verify isolated MySQL integration
        run: bash scripts/${{ matrix.script }}
