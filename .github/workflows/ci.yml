name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and test
        run: ./gradlew build

  mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate original MySQL schema
        run: python3 tools/verify_mysql_schema.py
      - name: Verify JDBC APIs against MySQL
        run: scripts/test-mysql.sh
      - name: Verify analysis persistence and JSON against MySQL
        run: scripts/test-analysis-mysql.sh
      - name: Verify query telemetry and index analysis against MySQL
        run: scripts/test-operations-mysql.sh
